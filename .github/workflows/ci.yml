name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Instala dependências
        run: pip install -r requirements.txt pytest httpx
      - name: Testes (inclui o fluxo completo com dados sintéticos)
        run: pytest

  integracao:
    # Caminho real: PostgreSQL do docker-compose.yml -> load_data.py -> treino lendo do banco -> imagem da API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Instala dependências
        run: pip install -r requirements.txt
      - name: Sobe o PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Carrega transações sintéticas no banco
        run: |
          mkdir -p data
          python src/sintetico.py data/creditcard.csv
          python load_data.py
      - name: Treina lendo do banco
        run: python train_model.py --n-iter 2 --bootstrap 100
      - name: Constrói e testa a imagem da API
        run: |
          docker build -t fraude-api .
          test "$(docker run --rm --entrypoint id fraude-api -u)" -ne 0
          docker run --rm --entrypoint sh fraude-api -c 'test -r /app/api.py && test -r /app/models/modelo_fraude.joblib && test -x /app/src'
          docker run --rm --entrypoint python fraude-api -c "import joblib; joblib.load('/app/models/modelo_fraude.joblib')"
          docker run -d --name api -p 8000:8000 fraude-api
          for i in $(seq 1 30); do curl -sf localhost:8000/saude > /dev/null && break; sleep 2; done
          curl -sf localhost:8000/saude
          python -c "import pandas as pd; pd.read_csv('data/creditcard.csv').drop(columns='Class').head(3).to_json('corpo.json', orient='records')"
          curl -sf -X POST localhost:8000/prever -H 'Content-Type: application/json' -d @corpo.json
      - name: Logs da API
        if: failure()
        run: docker logs api || true
